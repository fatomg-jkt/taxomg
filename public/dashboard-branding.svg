<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard Finance, Tax &amp; Legal Kantor Kencana</title>
  <desc id="desc">Premium navy, gold, and blue branding panel for the dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset="0.55" stop-color="#03102a"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8d978"/>
      <stop offset="0.45" stop-color="#fff1a8"/>
      <stop offset="1" stop-color="#d8a83f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="blueGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="700" height="350" rx="48" fill="#020617"/>
  <rect x="18" y="18" width="664" height="314" rx="42" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="30" y="30" width="640" height="290" rx="34" fill="url(#glow)"/>
  <rect x="33" y="33" width="634" height="284" rx="31" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <path d="M120 38 H580" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity=".95" filter="url(#blueGlow)"/>
  <path d="M120 312 H580" stroke="#2563eb" stroke-width="4" stroke-linecap="round" opacity=".8" filter="url(#blueGlow)"/>

  <text x="350" y="116" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#f8fafc">Dashboard</text>
  <text x="350" y="184" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="url(#gold)">Finance, Tax &amp; Legal</text>
  <line x1="166" y1="221" x2="294" y2="221" stroke="#d6b55a" stroke-width="2" opacity=".85"/>
  <line x1="406" y1="221" x2="534" y2="221" stroke="#d6b55a" stroke-width="2" opacity=".85"/>
  <path d="M350 211 l10 10 -10 10 -10 -10z" fill="none" stroke="#f8d978" stroke-width="2"/>
  <circle cx="329" cy="221" r="3" fill="#f8d978"/>
  <circle cx="371" cy="221" r="3" fill="#f8d978"/>
  <text x="350" y="282" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#f8fafc">Kantor Kencana</text>
</svg>
